<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cognitive Debugger v13 (Terminal Fix)</title>
  <style>
    @font-face {
      font-family: 'UniFont';
      src: url('./tileset_gen/unifont-17.0.03.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg-dark: #0d1117;
      --bg-panel: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --success: #238636;
      --danger: #da3633;
      --warning: #d29922;
      --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      background: var(--bg-dark); color: var(--text-main);
      font-family: var(--font-mono); font-size: 12px;
      height: 100vh; display: flex; overflow: hidden;
    }

    /* --- LAYOUT --- */
    #app { display: grid; grid-template-columns: 300px 1fr 400px; width: 100%; height: 100%; }

    .panel {
      background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      height: 100%;
    }
    .panel-right { border-left: 1px solid var(--border); border-right: none; }

    .panel-header {
      padding: 10px; background: #21262d; border-bottom: 1px solid var(--border);
      font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }

    .scroll-area { flex: 1; overflow-y: auto; padding: 10px; }

    /* --- MAP VIEWPORT --- */
    #viewport {
      position: relative; background: #000; overflow: hidden;
      display: flex; flex-direction: column;
    }
    canvas { display: block; outline: none; }

    #overlay-ui {
      position: absolute; top: 10px; left: 10px; pointer-events: none;
    }
    .hud-stat {
      background: rgba(0,0,0,0.8); padding: 5px 10px;
      border-radius: 4px; margin-bottom: 5px; border-left: 3px solid var(--accent);
      color: #fff; text-shadow: 0 1px 2px #000; font-size: 13px; font-weight: bold;
    }

    /* --- CONTROLS --- */
    button {
      background: #21262d; color: var(--text-main); border: 1px solid var(--border);
      padding: 6px 10px; cursor: pointer; border-radius: 4px; font-family: inherit;
      transition: background 0.1s; margin: 2px;
    }
    button:hover { background: #30363d; border-color: #8b949e; }
    button:active { transform: translateY(1px); }
    button.btn-primary { background: var(--success); border-color: rgba(255,255,255,0.1); color: white; }
    button.btn-danger { color: var(--danger); border-color: var(--danger); }

    input, select, textarea {
      background: var(--bg-dark); border: 1px solid var(--border);
      color: white; padding: 5px; border-radius: 4px; font-family: inherit; width: 100%;
    }
    textarea { resize: vertical; min-height: 60px; }

    .control-group { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .control-label { color: var(--text-muted); font-size: 10px; text-transform: uppercase; margin-bottom: 5px; }

    /* --- JSON TREE --- */
    .json-key { color: var(--text-muted); }
    .json-val { color: var(--accent); }
    .json-str { color: #a5d6ff; }
    .json-bool { color: var(--danger); }
    .json-toggle { cursor: pointer; user-select: none; margin-right: 4px; display: inline-block; width: 10px; }
    .json-obj { margin-left: 18px; border-left: 1px solid #30363d; padding-left: 5px; }
    .json-collapsed { display: none; }

    /* --- TABS --- */
    .tabs { display: flex; border-bottom: 1px solid var(--border); background: #21262d; flex-shrink: 0; }
    .tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; opacity: 0.6; }
    .tab:hover { background: #30363d; opacity: 1; }
    .tab.active { border-bottom-color: var(--accent); opacity: 1; color: white; }

    .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; height: 100%; }
    .tab-content.active { display: flex; }

    /* --- LOGS & CHAT --- */
    .log-entry { padding: 2px 5px; border-bottom: 1px solid #1f242c; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
    .log-time { color: #555; margin-right: 5px; user-select: none; }
    .t-error { color: var(--danger); }
    .t-warn { color: var(--warning); }
    .t-system { color: var(--text-muted); }
    .t-in { color: var(--success); }
    .t-out { color: var(--accent); }

    /* --- LOGIN MODAL --- */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 17, 23, 0.95); z-index: 100;
      display: flex; justify-content: center; align-items: center;
    }
    .modal {
      background: var(--bg-panel); padding: 30px; border: 1px solid var(--border);
      border-radius: 8px; width: 300px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* --- UTILS --- */
    .d-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .d-flex { display: flex; gap: 5px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #666; }
    .status-dot.online { background: var(--success); box-shadow: 0 0 5px var(--success); }

    .action-bar-btn {
      position: relative; overflow: hidden;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="modal">
    <h2 style="margin-top:0; color: var(--accent)">Cognitive Debugger v13</h2>
    <div class="control-group">
      <input type="text" id="conn-url" value="ws://localhost:8080/ws" placeholder="WebSocket URL">
    </div>
    <div class="control-group">
      <input type="text" id="conn-token" value="hero_1" placeholder="Entity ID to Possess">
    </div>
    <button class="btn-primary" style="width:100%" onclick="app.connect()">INITIALIZE LINK</button>
  </div>
</div>

<div id="app">
  <!-- LEFT PANEL: CONTROLS -->
  <div class="panel">
    <div class="panel-header">
      <span>Neural Link</span>
      <span id="status-indicator" class="status-dot"></span>
    </div>

    <div class="scroll-area">
      <!-- PLAYER INFO -->
      <div class="control-group">
        <div class="control-label">Active Agent</div>
        <div style="font-size: 14px; font-weight: bold; color: white;" id="agent-id">Disconnected</div>
        <div style="margin-top:5px; font-size:11px;" id="agent-pos">Pos: ?, ?</div>
      </div>

      <!-- CONTROLS -->
      <div class="control-group">
        <div class="control-label">Motor Functions</div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 120px; margin: 0 auto;">
          <div></div><button onclick="app.sendDir(0, -1)">W</button><div></div>
          <button onclick="app.sendDir(-1, 0)">A</button><button onclick="app.sendAction('WAIT')">.</button><button onclick="app.sendDir(1, 0)">D</button>
          <div></div><button onclick="app.sendDir(0, 1)">S</button><div></div>
        </div>
        <div class="d-grid-2" style="margin-top: 10px;">
          <button onclick="app.interact()">INTERACT</button>
          <button onclick="app.pickup()">PICK UP</button>
        </div>
      </div>

      <!-- SPELLS -->
      <div class="control-group">
        <div class="control-label">Abilities</div>
        <div id="spell-list" style="display: flex; flex-wrap: wrap; gap: 5px;">
          <em style="color:#666">Waiting for data...</em>
        </div>
      </div>

      <!-- INVENTORY -->
      <div class="control-group">
        <div class="control-label">Inventory</div>
        <div id="inv-list" style="max-height: 200px; overflow-y: auto;">
          <div style="color:#666; font-style:italic">Empty</div>
        </div>
        <div class="d-flex" style="margin-top:5px">
          <button style="flex:1; font-size:10px" onclick="app.invAction('USE')">USE</button>
          <button style="flex:1; font-size:10px" onclick="app.invAction('EQUIP')">EQP</button>
          <button style="flex:1; font-size:10px" onclick="app.invAction('DROP')">DROP</button>
        </div>
      </div>

      <!-- GOD MODE -->
      <div class="control-group">
        <div class="control-label" style="color:var(--accent)">Admin Override</div>
        <select id="spawn-id" style="margin-bottom: 5px;">
          <option value="goblin">Goblin</option>
          <option value="orc">Orc</option>
          <option value="health_potion">Potion</option>
          <option value="iron_sword">Sword</option>
        </select>
        <div class="d-grid-2">
          <button onclick="app.cheatSpawn()">SPAWN</button>
          <button class="btn-danger" onclick="app.cheatKill()">KILL TGT</button>
          <button onclick="app.cheatHeal()">HEAL ME</button>
          <button onclick="app.cheatTeleport()">TP HERE</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MIDDLE PANEL: CANVAS -->
  <div id="viewport">
    <canvas id="game-canvas"></canvas>
    <div id="overlay-ui">
      <div class="hud-stat" id="hud-hp">HP: --/--</div>
      <div class="hud-stat" id="hud-mana" style="border-color: #a371f7;">MP: --/--</div>
      <div style="font-size:10px; color:#888; margin-top:5px; background: rgba(0,0,0,0.5); padding: 4px;">
        LMB: Select | <b>Shift+LMB: Teleport</b>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL: INSPECTOR & LOGS -->
  <div class="panel panel-right">
    <div class="tabs">
      <div class="tab active" data-target="tab-inspector" onclick="app.setTab('tab-inspector')">INSPECTOR</div>
      <div class="tab" data-target="tab-logs" onclick="app.setTab('tab-logs')">LOGS</div>
      <div class="tab" data-target="tab-chat" onclick="app.setTab('tab-chat')">CHAT</div>
      <div class="tab" data-target="tab-terminal" onclick="app.setTab('tab-terminal')">TERMINAL</div>
    </div>

    <!-- INSPECTOR -->
    <div id="tab-inspector" class="tab-content active scroll-area">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <span class="control-label">Selected Entity</span>
        <label style="font-size:10px; display:flex; align-items:center; gap:5px; cursor:pointer">
          <input type="checkbox" id="inspector-auto" style="width:auto"> Auto-Watch
        </label>
      </div>
      <div id="inspector-tree" style="user-select: text;">Select an entity...</div>
    </div>

    <!-- LOGS -->
    <div id="tab-logs" class="tab-content scroll-area" style="font-family: 'Consolas', monospace;">
      <div id="log-container"></div>
    </div>

    <!-- CHAT -->
    <div id="tab-chat" class="tab-content">
      <div id="chat-history" style="flex:1; overflow-y: auto; padding: 10px; font-size: 13px;"></div>
      <div style="padding:10px; border-top:1px solid var(--border)">
        <input type="text" id="chat-input" placeholder="Say something..." onkeydown="if(event.key==='Enter') app.sendChat(this)">
      </div>
    </div>

    <!-- TERMINAL (RAW) -->
    <div id="tab-terminal" class="tab-content scroll-area">
      <div class="control-label">Raw Request</div>
      <textarea id="raw-input" placeholder='{"action": "MOVE", "payload": {"dx": 0, "dy": 1}}'></textarea>
      <button class="btn-primary" style="width:100%; margin-top:5px" onclick="app.sendRawFromInput()">SEND JSON</button>

      <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center">
        <span class="control-label">Traffic Monitor</span>
        <label style="font-size:10px; color:#888;"><input type="checkbox" id="log-updates"> Log Updates</label>
      </div>
      <div id="traffic-log" style="font-size:10px; font-family:monospace; color:#888;"></div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const create = (tag, cls) => { const e = document.createElement(tag); if(cls) e.className=cls; return e; };

  class JSONTree {
    static create(data, rootLabel = null) {
      if (typeof data !== 'object' || data === null) {
        const span = create('span');
        if (typeof data === 'string') { span.className = 'json-str'; span.innerText = `"${data}"`; }
        else if (typeof data === 'boolean') { span.className = 'json-bool'; span.innerText = data; }
        else { span.className = 'json-val'; span.innerText = data; }
        return span;
      }

      const container = create('div');
      const header = create('div');
      const toggle = create('span', 'json-toggle');
      toggle.innerText = '▼';

      const label = create('span', 'json-key');
      label.innerText = rootLabel ? rootLabel : (Array.isArray(data) ? `[${data.length}]` : '{...}');

      header.appendChild(toggle);
      header.appendChild(label);
      container.appendChild(header);

      const children = create('div', 'json-obj');
      header.onclick = (e) => {
        e.stopPropagation();
        if (children.classList.contains('json-collapsed')) {
          children.classList.remove('json-collapsed');
          toggle.innerText = '▼';
        } else {
          children.classList.add('json-collapsed');
          toggle.innerText = '▶';
        }
      };

      for (let key in data) {
        const line = create('div');
        const keySpan = create('span', 'json-key');
        keySpan.innerText = key + ": ";
        line.appendChild(keySpan);
        line.appendChild(JSONTree.create(data[key]));
        children.appendChild(line);
      }

      container.appendChild(children);
      return container;
    }
  }

  class Renderer {
    constructor(canvasId, onClick) {
      this.canvas = $(canvasId);
      this.ctx = this.canvas.getContext('2d');
      this.tileSize = 32;
      this.camera = { x: 0, y: 0, zoom: 1 };
      this.map = [];
      this.entities = [];
      this.hoverTile = { x: -1, y: -1 };
      this.selectedId = null;

      let isDragging = false;
      let dragStart = { x: 0, y: 0 };
      let lastMouse = { x: 0, y: 0 };

      const resize = () => {
        if(!this.canvas.parentElement) return;
        this.canvas.width = this.canvas.parentElement.offsetWidth;
        this.canvas.height = this.canvas.parentElement.offsetHeight;
        this.draw();
      };
      window.addEventListener('resize', resize);
      setTimeout(resize, 50);

      this.canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        this.camera.zoom = Math.max(0.5, Math.min(3.0, this.camera.zoom + delta));
        this.draw();
      }, { passive: false });

      this.canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStart = { x: e.clientX, y: e.clientY };
        lastMouse = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        const dist = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
        if (dist < 5) onClick(this.hoverTile.x, this.hoverTile.y, e.shiftKey);
      });

      this.canvas.addEventListener('mousemove', (e) => {
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const worldX = (mx - this.canvas.width/2) / (this.tileSize * this.camera.zoom) + this.camera.x;
        const worldY = (my - this.canvas.height/2) / (this.tileSize * this.camera.zoom) + this.camera.y;
        this.hoverTile = { x: Math.floor(worldX), y: Math.floor(worldY) };

        if (isDragging) {
          const dx = (e.clientX - lastMouse.x) / (this.tileSize * this.camera.zoom);
          const dy = (e.clientY - lastMouse.y) / (this.tileSize * this.camera.zoom);
          this.camera.x -= dx;
          this.camera.y -= dy;
          lastMouse = { x: e.clientX, y: e.clientY };
        }
        this.draw();
      });
    }

    updateData(mapData, entitiesData) {
      if (mapData) this.map = mapData;
      if (entitiesData) this.entities = entitiesData;
      this.draw();
    }

    draw() {
      const ctx = this.ctx;
      const cw = this.canvas.width;
      const ch = this.canvas.height;
      const ts = this.tileSize;
      const zoom = this.camera.zoom;

      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, cw, ch);

      ctx.save();
      ctx.translate(cw / 2, ch / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-this.camera.x * ts, -this.camera.y * ts);

      this.map.forEach(t => {
        const tx = t.x * ts;
        const ty = t.y * ts;
        if (t.symbol === '.') {
          ctx.fillStyle = t.isVisible ? '#111' : '#080808';
          ctx.fillRect(tx, ty, ts, ts);
        }
        if (t.isVisible || t.isExplored) {
          ctx.fillStyle = t.isVisible ? (t.color || '#444') : '#222';
          ctx.font = `${ts-4}px UniFont`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(t.symbol, tx + ts/2, ty + ts/2 + 2);
        }
      });

      this.entities.forEach(e => {
        const ex = e.pos.x * ts;
        const ey = e.pos.y * ts;

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(ex + ts/2, ey + ts - 2, ts/3, ts/6, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = e.render?.color || '#fff';
        if (e.stats?.isDead) { ctx.fillStyle = '#444'; ctx.globalAlpha = 0.5; }
        ctx.font = `bold ${ts-2}px monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(e.render?.symbol || '?', ex + ts/2, ey + ts/2 + 2);
        ctx.globalAlpha = 1.0;

        if (e.id === this.selectedId) {
          ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 2;
          ctx.strokeRect(ex, ey, ts, ts);
        }
      });

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(this.hoverTile.x * ts, this.hoverTile.y * ts, ts, ts);
      ctx.restore();
    }
  }

  class App {
    constructor() {
      this.ws = null;
      this.token = null;
      this.myId = null;
      this.entitiesCache = [];
      this.selectedInvItem = null;
      this.stateCache = { spellsHash: "", invHash: "" };

      this.renderer = new Renderer('game-canvas', (x, y, isShift) => this.onMapClick(x, y, isShift));

      if(localStorage.getItem('cd_url')) $('conn-url').value = localStorage.getItem('cd_url');
      if(localStorage.getItem('cd_token')) $('conn-token').value = localStorage.getItem('cd_token');
    }

    connect() {
      const url = $('conn-url').value;
      const token = $('conn-token').value;
      localStorage.setItem('cd_url', url);
      localStorage.setItem('cd_token', token);

      this.token = token;
      this.ws = new WebSocket(url);

      this.ws.onopen = () => {
        $('login-overlay').style.display = 'none';
        $('status-indicator').classList.add('online');
        this.send('LOGIN', { token: token });
        this.log('system', 'Neural Link Established.');
      };
      this.ws.onclose = () => {
        $('login-overlay').style.display = 'flex';
        $('status-indicator').classList.remove('online');
        this.log('error', 'Connection lost.');
      };
      this.ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);

        // --- TRAFFIC MONITOR (With Filter) ---
        if ($('tab-terminal').classList.contains('active')) {
          const logUpdates = $('log-updates').checked;
          if (msg.type !== 'UPDATE' || logUpdates) {
            const line = create('div');
            line.className = 't-in';
            line.innerText = `IN: ${evt.data.substring(0, 150)}${evt.data.length>150?'...':''}`;
            $('traffic-log').prepend(line);
          }
        }

        this.handleMessage(msg);
      };
    }

    send(action, payload = {}) {
      if (this.ws && this.ws.readyState === 1) {
        const str = JSON.stringify({ action, payload });
        this.ws.send(str);

        if ($('tab-terminal').classList.contains('active')) {
          const line = create('div');
          line.className = 't-out';
          line.innerText = `OUT: ${str}`;
          $('traffic-log').prepend(line);
        }
      }
    }

    sendRawFromInput() {
      try {
        const raw = $('raw-input').value;
        const json = JSON.parse(raw);
        this.send(json.action, json.payload);
      } catch(e) {
        alert("Invalid JSON");
      }
    }

    handleMessage(msg) {
      if (msg.error) this.log('error', msg.error);

      switch (msg.type) {
        case 'UPDATE':
          this.processUpdate(msg);
          break;
        case 'CHAT':
          // Try to handle varied JSON structures
          const payload = msg.data || msg.payload || msg;
          this.addChat(payload);
          break;
      }
    }

    processUpdate(data) {
      if (data.myEntityId) this.myId = data.myEntityId;
      this.entitiesCache = data.entities || [];
      this.renderer.updateData(data.map, this.entitiesCache);

      let me = this.entitiesCache.find(e => e.id == this.myId);
      if (!me && data.myEntityId) {
        me = this.entitiesCache.find(e => e.type === 'UNIT' && e.name === this.token);
      }

      if (me) {
        $('agent-id').innerText = `${me.name}`;
        $('agent-pos').innerText = `X:${me.pos.x} Y:${me.pos.y}`;
        if (me.stats) {
          $('hud-hp').innerText = `HP: ${me.stats.hp}/${me.stats.maxHp}`;
          const hpPct = (me.stats.hp / me.stats.maxHp) * 100;
          $('hud-hp').style.background = `linear-gradient(90deg, rgba(218, 54, 51, 0.4) ${hpPct}%, rgba(0,0,0,0.7) ${hpPct}%)`;
        }
        this.renderInventory(me);
      }

      if (data.spells) this.renderSpells(data.spells);
      if (data.logs) data.logs.forEach(l => this.log('info', l.text));

      if (this.renderer.selectedId && $('inspector-auto').checked) {
        const target = this.entitiesCache.find(e => e.id === this.renderer.selectedId);
        const container = $('inspector-tree');
        container.innerHTML = '';
        if (target) container.appendChild(JSONTree.create(target, target.name));
      }
    }

    renderSpells(spells) {
      const hash = JSON.stringify(spells.map(s => s.id + s.name + s.cost));
      if (hash === this.stateCache.spellsHash) return;
      this.stateCache.spellsHash = hash;

      const div = $('spell-list');
      div.innerHTML = '';
      spells.forEach(s => {
        const b = create('button', 'action-bar-btn');
        b.innerText = s.name;
        b.title = `Cost: ${s.cost}`;
        b.onclick = () => {
          const target = this.renderer.selectedId || this.myId;
          this.send('CAST', { spellId: s.id, targetId: target });
        };
        if(s.name.includes('Fire')) b.style.color = 'var(--warning)';
        if(s.name.includes('Heal')) b.style.color = 'var(--success)';
        div.appendChild(b);
      });
    }

    renderInventory(me) {
      const items = me.inventory ? me.inventory.items : [];
      const equip = me.equipment || {};
      const hash = JSON.stringify({ i: items, e: equip, sel: this.selectedInvItem });
      if (hash === this.stateCache.invHash) return;
      this.stateCache.invHash = hash;

      const list = $('inv-list');
      list.innerHTML = '';
      let hasItems = false;

      for(let slot in equip) {
        const item = equip[slot];
        if(!item) continue;
        hasItems = true;
        this.createInvRow(list, item, `[${slot}]`, 'var(--warning)');
      }
      items.forEach(item => {
        hasItems = true;
        this.createInvRow(list, item, '', 'var(--success)');
      });

      if (!hasItems) list.innerHTML = '<div style="color:#666; font-style:italic; padding:5px;">Empty</div>';
    }

    createInvRow(container, item, prefix, color) {
      const row = create('div');
      row.style.padding = '4px';
      row.style.borderLeft = `2px solid ${color}`;
      row.style.background = (this.selectedInvItem === item.id) ? '#30363d' : 'transparent';
      row.style.cursor = 'pointer';
      row.innerText = `${prefix} ${item.name} ${item.stackSize > 1 ? '(x'+item.stackSize+')' : ''}`;
      row.onclick = () => {
        this.selectedInvItem = item.id;
        this.stateCache.invHash = "";
      };
      container.appendChild(row);
    }

    invAction(action) {
      if(!this.selectedInvItem) return;
      this.send(action, { itemId: this.selectedInvItem });
    }

    onMapClick(x, y, isShift) {
      if (isShift) {
        this.send('ADMIN_TELEPORT', { x, y });
        return;
      }

      const ent = this.entitiesCache.find(e => e.pos.x === x && e.pos.y === y);
      if (ent) {
        this.renderer.selectedId = ent.id;
        this.log('system', `Selected: ${ent.name}`);
        const container = $('inspector-tree');
        container.innerHTML = '';
        container.appendChild(JSONTree.create(ent, ent.name));
        this.setTab('tab-inspector');
      } else {
        this.renderer.selectedId = null;
        $('inspector-tree').innerText = "No target selected";
      }
      this.renderer.draw();
    }

    log(type, msg) {
      const c = $('log-container');
      const entry = create('div', 'log-entry');
      if (type === 'error') entry.classList.add('t-error');
      if (type === 'warn') entry.classList.add('t-warn');
      if (type === 'system') entry.classList.add('t-system');
      const time = create('span', 'log-time');
      time.innerText = new Date().toLocaleTimeString();
      entry.appendChild(time);
      entry.appendChild(document.createTextNode(msg));
      c.appendChild(entry);
      c.scrollTop = c.scrollHeight;
    }

    addChat(data) {
      if (!data) return;
      const h = $('chat-history');
      const d = create('div');
      d.style.marginBottom = "4px";
      const sender = data.senderName || data.SenderName || 'Sys';
      const txt = data.text || data.Text || data.message || JSON.stringify(data);

      d.innerHTML = `<span style="color:#888">[${sender}]</span> ${txt}`;
      h.appendChild(d);
      h.scrollTop = h.scrollHeight;
    }

    sendChat(input) {
      const txt = input.value.trim();
      if(!txt) return;
      this.send('CHAT', { message: txt });
      input.value = '';
    }

    setTab(targetId) {
      document.querySelectorAll('.tab').forEach(t => {
        if (t.dataset.target === targetId) t.classList.add('active');
        else t.classList.remove('active');
      });
      document.querySelectorAll('.tab-content').forEach(c => {
        if (c.id === targetId) c.classList.add('active');
        else c.classList.remove('active');
      });
    }

    cheatSpawn() { this.send('ADMIN_SPAWN', { template: $('spawn-id').value }); }
    cheatKill() { if(this.renderer.selectedId) this.send('ADMIN_KILL', { targetId: this.renderer.selectedId }); }
    cheatHeal() { this.send('ADMIN_HEAL'); }
    cheatTeleport() { if(this.renderer.hoverTile.x !== -1) this.send('ADMIN_TELEPORT', { x: this.renderer.hoverTile.x, y: this.renderer.hoverTile.y }); }
    interact() { if(this.renderer.selectedId) this.send('INTERACT', { targetId: this.renderer.selectedId }); }
    pickup() {
      const me = this.entitiesCache.find(e => e.id == this.myId);
      if(!me) return;
      const item = this.entitiesCache.find(e => e.type === 'ITEM' && e.pos.x === me.pos.x && e.pos.y === me.pos.y);
      if(item) this.send('PICKUP', {itemId: item.id});
    }
    sendDir(dx, dy) { this.send('MOVE', { dx, dy }); }
    sendAction(act) { this.send(act); }
  }

  const app = new App();

  document.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch(e.key.toLowerCase()) {
      case 'w': app.sendDir(0, -1); break;
      case 's': app.sendDir(0, 1); break;
      case 'a': app.sendDir(-1, 0); break;
      case 'd': app.sendDir(1, 0); break;
      case ' ': app.sendAction('WAIT'); break;
    }
  });
</script>
</body>
</html>
